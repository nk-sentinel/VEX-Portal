[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Versions are pinned deliberately and must not be floated. This portal exists
# to review OSS vulnerability findings; an unpinned dependency tree here would
# be an unforced irony as well as an unforced risk.
name = "vex-portal"
version = "0.1.0"
description = "VEX Portal — evidence-based CVE applicability determinations over Nexus IQ."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "sqlalchemy[asyncio]==2.0.50",
  "aiosqlite==0.21.0",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "httpx==0.28.1",          # IQ / Bitbucket / JFrog adapters
  "ldap3==2.9.1",           # AD-backed RBAC, mirroring DAST-Portal
  "boto3==1.40.30",         # Bedrock adjudicator
  "python-multipart==0.0.32",
  "itsdangerous>=2.2,<3",
  "argon2-cffi==25.1.0",    # local-provider password hashing (app/auth/local.py)
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "coverage>=7,<8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # ldap3==2.9.1 (pinned; mirrors DAST-Portal) imports pyasn1's tagMap/typeMap
  # module attributes at `import ldap3` time, purely to build its extended-
  # operations registry — this fires unconditionally, before app/auth/ldap.py
  # code runs at all, on every currently-available pyasn1 release (0.6.x
  # renamed both to TAG_MAP/TYPE_MAP behind a PEP 562 deprecation shim; no
  # older, un-deprecated pyasn1 release supports Python 3.12). Ignoring these
  # two specific, vendor-internal warnings (not first-party code) is what
  # makes `ldap3` importable at all under this project's otherwise-blanket
  # warnings-as-errors policy; every other DeprecationWarning, including any
  # new one from this project's own code, still fails the suite. Listed after
  # the two `error::` rules above so it takes precedence for exactly this
  # message/module pair — see the Task 1-3 report.
  "ignore:tagMap is deprecated:DeprecationWarning:ldap3.utils.asn1",
  "ignore:typeMap is deprecated:DeprecationWarning:ldap3.utils.asn1",
]

# `/fakes` (repo root, sibling of `backend/`) is deliberately OUT OF SCOPE for both ruff and
# mypy here — `just lint` invokes `ruff check app tests` / `mypy app`, both already scoped to
# directories under `backend/`, so `/fakes` was never implicitly covered and this is a
# decision, not an accident. `/fakes` is throwaway scaffolding standing in for Nexus IQ,
# JFrog, Bitbucket and Bedrock (see /fakes/README.md) — it never ships, is never imported by
# `app/`, and isn't held to this project's strict-mypy/product bar. It is still written cleanly
# and type-annotated; the exclusion is about not gating CI on disposable code, not license to
# be sloppy. If `/fakes` is ever promoted to a real, shipped component, remove this comment and
# add it to both commands' scope.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom is `param: X = Depends(get_x)` —
# the call in the default is how FastAPI recognises a dependency at all, not
# the mutable-default-argument footgun B008 exists to catch. `app/api/auth.py`
# is the first module in this project to use it; every route Tasks 3-6 add
# will hit the same pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# boto3/botocore ship no py.typed marker and no bundled stubs, and adding a
# stub-only package (`boto3-stubs`/`types-boto3-bedrock-runtime`) would be a
# new dependency this project's pinned-versions rule (pyproject.toml, top of
# file) does not currently carry. app/adapters/llm/client.py (the one place
# either is imported) is otherwise fully strict-typed; this override only
# silences "missing library stubs" for these two third-party packages, it
# does not loosen strictness for any first-party code.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ldap3 ships no py.typed marker and no bundled stubs either — same rationale
# as the boto3/botocore override above: a stub-only package (`types-ldap3`)
# would be a new dependency the pinned-versions rule doesn't currently carry.
# app/auth/ldap.py (the one place it is imported) is otherwise fully
# strict-typed; this only silences "missing library stubs" for ldap3 itself.
[[tool.mypy.overrides]]
module = ["ldap3.*"]
ignore_missing_imports = true
