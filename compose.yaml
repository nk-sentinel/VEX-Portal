# VEX Portal — API service, fronted by Traefik.
#
# Public entry: vex.shadow-lab.org -> Cloudflare tunnel -> Traefik (web
# entrypoint) -> vex-portal-api. TLS terminates at Cloudflare — no
# certresolver label here.
#
# Service name is stack-unique (vex-portal-api) per house convention: the
# `proxy` network is shared across every stack on this host, and Compose
# registers each service name as a DNS alias on it. A generic name like
# `api` would collide with another stack's identically-named service and
# Docker DNS would round-robin between them.
#
# The portal's database is a single SQLite file (see backend/app/db.py), and
# this project is single-replica by design (see CLAUDE.md) — this
# container's data volume is its own, never bind-mounted to the host venv's
# backend/data/, which `just dev-api` and `just migrate` use. Running both
# against the same file at once would be two writers against one
# single-replica database. Migrations for THIS container are not wired up
# yet (no auto-migrate-at-boot entrypoint); only `just migrate`, against the
# host-venv database, is — see Task 5's brief and the report's concerns.
#
# Deploy:  docker compose up -d --build
# Secrets: .env (gitignored) — see .env.example.

services:
  vex-portal-api:
    build: ./backend
    image: vex-portal-api:latest
    container_name: vex-portal-api
    env_file: [.env]
    volumes:
      - vex_portal_data:/app/data
    networks: [proxy]
    restart: unless-stopped
    # No `ports:` — never publish to the host; only Traefik reaches it, and
    # publishing 8000 here would collide with `just dev-api`'s host port.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vex-portal-api.rule=Host(`vex.shadow-lab.org`)"
      - "traefik.http.routers.vex-portal-api.entrypoints=web"
      - "traefik.http.services.vex-portal-api.loadbalancer.server.port=8000"

  # --- Fake external systems (Task 7) — THROWAWAY, see /fakes/README.md ---
  #
  # Stand-ins for Nexus IQ, JFrog Artifactory, Bitbucket Data Center, and AWS
  # Bedrock: the four systems this portal talks to that shadowlab cannot
  # reach directly. One shared image (fakes/Dockerfile, built from THIS
  # file's directory so it can copy fakes/ with its "fakes." import prefix
  # intact) — which fake a container runs is chosen entirely by its
  # `command:`.
  #
  # Service names are stack-unique (`vex-fake-*`) per house convention.
  # Each joins BOTH `proxy` and `dev-network` (shared across every stack on
  # this host) purely for the DNS alias, with no Traefik labels — these are
  # never meant to be reachable from the public internet. vex-portal-api is
  # already on `proxy`, so it can resolve these by name with no change to
  # its own service block, which means no need to touch (or restart) the
  # container already running from Task 5. Host ports 9101-9104 are
  # published to match app/config.py's fake_*_url defaults exactly, so
  # `just dev-api` (host venv) and pytest reach them at plain
  # http://localhost:910x with zero .env changes.
  vex-fake-iq:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-iq:latest
    container_name: vex-fake-iq
    command: ["uvicorn", "fakes.iq.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9101:8000"]
    restart: unless-stopped

  vex-fake-jfrog:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-jfrog:latest
    container_name: vex-fake-jfrog
    command: ["uvicorn", "fakes.jfrog.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9102:8000"]
    restart: unless-stopped

  vex-fake-bitbucket:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-bitbucket:latest
    container_name: vex-fake-bitbucket
    command: ["uvicorn", "fakes.bitbucket.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9103:8000"]
    restart: unless-stopped

  vex-fake-bedrock:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-bedrock:latest
    container_name: vex-fake-bedrock
    command: ["uvicorn", "fakes.bedrock.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9104:8000"]
    restart: unless-stopped

networks:
  proxy:
    external: true
  dev-network:
    external: true

volumes:
  vex_portal_data: {}
