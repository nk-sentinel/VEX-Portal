# VEX Portal — API + web, fronted by Traefik.
#
# Public entry: vex.shadow-lab.org -> Cloudflare tunnel -> Traefik (web
# entrypoint) -> one of two routers on the SAME hostname, split by path:
#   - Host(vex.shadow-lab.org) && PathPrefix(`/api`) -> vex-portal-api
#   - Host(vex.shadow-lab.org)                       -> vex-portal-web
# Traefik computes router priority from rule length by default, which
# already makes the longer `&&` rule win over the bare `Host` rule, but the
# priority is set explicitly below anyway — this ordering is load-bearing
# (get it wrong and every page request 404s against the API, or the API
# never receives a request at all), not a styling choice worth leaving
# implicit. TLS terminates at Cloudflare — no certresolver label anywhere
# in this file.
#
# Service names are stack-unique (vex-portal-api, vex-portal-web) per house
# convention: the `proxy` network is shared across every stack on this
# host, and Compose registers each service name as a DNS alias on it. A
# generic name like `api` or `web` would collide with another stack's
# identically-named service and Docker DNS would round-robin between them.
#
# The portal's database is a single SQLite file (see backend/app/db.py), and
# this project is single-replica by design (see CLAUDE.md) — this
# container's data volume is its own, never bind-mounted to the host venv's
# backend/data/, which `just dev-api` and `just migrate` use. Running both
# against the same file at once would be two writers against one
# single-replica database. Migrations for THIS container are not wired up
# yet (no auto-migrate-at-boot entrypoint); only `just migrate`, against the
# host-venv database, is — see Task 5's brief and the report's concerns.
#
# Deploy:  docker compose up -d --build
# Secrets: .env (gitignored) — see .env.example. Task 4-6's report flags a
# real bug this deploy step had to work around: JFROG_TOKEN/BITBUCKET_TOKEN
# defaulting to empty (the shipped .env.example value) makes
# `JFrogHttpClient`/`BitbucketHttpClient` build the illegal HTTP header
# `Authorization: Bearer ` (trailing space, no token), which httpx refuses
# to send client-side — every artifact fetch fails, admission never passes,
# and no assessment can ever be raised. Both are set to a non-empty
# placeholder in .env (config only, not a code change) so the fake-mode
# demo this task must verify actually works; see the report for the
# recommended backend-code fix, which is out of this task's file scope.

services:
  vex-portal-api:
    build: ./backend
    image: vex-portal-api:latest
    container_name: vex-portal-api
    env_file: [.env]
    # Overrides FAKE_IQ_URL/etc from .env, which default to
    # http://localhost:910x — correct for `just dev-api` (a HOST process
    # reaching the fakes' published host ports) but wrong for THIS
    # container, where "localhost" is its own network namespace, not the
    # fakes'. The fakes are reachable by their compose SERVICE NAME on the
    # shared `proxy` network (they're on it precisely for this DNS alias —
    # see the vex-fake-* block's own comment below) at their container-
    # internal port 8000, never the host-published 910x one. Discovered
    # while verifying this task's end-to-end flow against the deployed
    # container: every admission attempt failed 503 "Nexus IQ is
    # unreachable" until this was added — see the task report.
    environment:
      FAKE_IQ_URL: http://vex-fake-iq:8000
      FAKE_JFROG_URL: http://vex-fake-jfrog:8000
      FAKE_BITBUCKET_URL: http://vex-fake-bitbucket:8000
      FAKE_BEDROCK_URL: http://vex-fake-bedrock:8000
    volumes:
      - vex_portal_data:/app/data
    networks: [proxy]
    restart: unless-stopped
    # No `ports:` — never publish to the host; only Traefik reaches it, and
    # publishing 8000 here would collide with `just dev-api`'s host port.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vex-portal-api.rule=Host(`vex.shadow-lab.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.vex-portal-api.entrypoints=web"
      - "traefik.http.routers.vex-portal-api.priority=100"
      - "traefik.http.services.vex-portal-api.loadbalancer.server.port=8000"

  # Production Angular build, served by nginx (web/Dockerfile). Everything
  # NOT under /api on this hostname lands here — the SPA owns client-side
  # routing (/login, /assessments, /review, ...) via index.html's fallback
  # (web/nginx.conf).
  vex-portal-web:
    build: ./web
    image: vex-portal-web:latest
    container_name: vex-portal-web
    networks: [proxy]
    restart: unless-stopped
    depends_on: [vex-portal-api]
    # No `ports:` — same reasoning as vex-portal-api: only Traefik reaches it.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vex-portal-web.rule=Host(`vex.shadow-lab.org`)"
      - "traefik.http.routers.vex-portal-web.entrypoints=web"
      - "traefik.http.routers.vex-portal-web.priority=1"
      - "traefik.http.services.vex-portal-web.loadbalancer.server.port=80"

  # --- Fake external systems (Task 7) — THROWAWAY, see /fakes/README.md ---
  #
  # Stand-ins for Nexus IQ, JFrog Artifactory, Bitbucket Data Center, and AWS
  # Bedrock: the four systems this portal talks to that shadowlab cannot
  # reach directly. One shared image (fakes/Dockerfile, built from THIS
  # file's directory so it can copy fakes/ with its "fakes." import prefix
  # intact) — which fake a container runs is chosen entirely by its
  # `command:`.
  #
  # Service names are stack-unique (`vex-fake-*`) per house convention.
  # Each joins BOTH `proxy` and `dev-network` (shared across every stack on
  # this host) purely for the DNS alias, with no Traefik labels — these are
  # never meant to be reachable from the public internet. vex-portal-api is
  # already on `proxy`, so it can resolve these by name with no change to
  # its own service block, which means no need to touch (or restart) the
  # container already running from Task 5. Host ports 9101-9104 are
  # published to match app/config.py's fake_*_url defaults exactly, so
  # `just dev-api` (host venv) and pytest reach them at plain
  # http://localhost:910x with zero .env changes.
  vex-fake-iq:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-iq:latest
    container_name: vex-fake-iq
    command: ["uvicorn", "fakes.iq.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9101:8000"]
    restart: unless-stopped

  vex-fake-jfrog:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-jfrog:latest
    container_name: vex-fake-jfrog
    command: ["uvicorn", "fakes.jfrog.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9102:8000"]
    restart: unless-stopped

  vex-fake-bitbucket:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-bitbucket:latest
    container_name: vex-fake-bitbucket
    command: ["uvicorn", "fakes.bitbucket.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9103:8000"]
    restart: unless-stopped

  vex-fake-bedrock:
    build: {context: ., dockerfile: fakes/Dockerfile}
    image: vex-fake-bedrock:latest
    container_name: vex-fake-bedrock
    command: ["uvicorn", "fakes.bedrock.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [proxy, dev-network]
    ports: ["9104:8000"]
    restart: unless-stopped

networks:
  proxy:
    external: true
  dev-network:
    external: true

volumes:
  vex_portal_data: {}
