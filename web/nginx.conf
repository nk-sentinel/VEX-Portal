# VEX Portal — nginx: serve the built Angular SPA.
#
# No `/api` proxying here, unlike DAST-Portal's nginx.conf. That portal's
# backend mounts routers at the root and collides with client routes
# (`/dashboard`, `/requests`, ...), which forces its nginx to
# content-negotiate every request. VEX Portal's backend mounts everything
# under `/api` (plus `/health`) with no client-route collision, so Traefik
# itself routes `/api/*` straight to `vex-portal-api` before the request
# ever reaches this container (`compose.yaml`'s two routers, split by
# `PathPrefix(/api)` vs a bare `Host` rule) — this file only has to serve
# static files and fall back to `index.html` for client-side routes.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening — cheap, no functional risk, no CSP here (untested
    # against Angular's own runtime style/script injection in this task's
    # time box; see the task report).
    #
    # Repeated in EVERY location block below that sets its own
    # `add_header` (Cache-Control), not just declared once here: nginx only
    # inherits `add_header`s from an outer block when the inner block
    # defines NONE of its own — a location that adds even one header of its
    # own silences every server-level header for that location. (Caught
    # empirically while verifying this deploy — the first version of this
    # file shipped the three headers below only at the server level and
    # they silently never reached a single real response.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build output (main-*.js, chunk-*.js, styles-*.css) is safe to
    # cache forever; index.html itself must never be cached, or a deploy
    # ships new hashed chunk names that a stale cached shell never requests.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
